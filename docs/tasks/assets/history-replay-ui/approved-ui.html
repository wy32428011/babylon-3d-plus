<script>
'use strict';
const $ = id => document.getElementById(id);
const BASE = Date.parse('2026-11-02T09:00:00+08:00');
const GAP_START = BASE + 2220e3, GAP_END = BASE + 2400e3, VERSION_TIME = BASE + 2700e3;
const keyEvents = [{at:BASE+600e3,kind:'alarm',glyph:'△',label:'设备告警'},{at:BASE+1560e3,kind:'transfer',glyph:'◇',label:'货物交接完成'},{at:BASE+3060e3,kind:'stock',glyph:'○',label:'货物入库'}];
const state = {from:BASE,to:BASE+3600e3,current:BASE+754e3,playing:false,speed:1,mode:'paused',generation:0,dragging:false,resume:false,target:null};
let seekTimer, toastTimer, lastFrame = performance.now();
const formatter = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const time = ms => formatter.format(new Date(ms));
const dateInput = ms => new Date(ms+8*3600e3).toISOString().slice(0,19);
const duration = ms => {const s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');};
const position = ms => (ms-state.from)/(state.to-state.from)*100;
const inGap = ms => ms>=GAP_START && ms<GAP_END;
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}
function status(message, action, callback, error=false){$('statusLine').hidden=!message;$('statusText').textContent=message||'';$('statusLine').classList.toggle('error',error);$('statusAction').hidden=!action;$('statusAction').textContent=action||'';$('statusAction').onclick=callback||null;}
function gapStatus(message){const hasNext=GAP_END<state.to;status(message,hasNext?'跳至下一可用时刻':'调整时间范围',hasNext?()=>seek(GAP_END,false):()=>$('rangeButton').click());}
function drawTimeline(){
  $('ticks').replaceChildren();for(let i=0;i<=6;i++){const t=document.createElement('span');t.className='tick';t.textContent=time(state.from+(state.to-state.from)*i/6).slice(0,5);$('ticks').append(t);}
  const start=Math.max(state.from,GAP_START),end=Math.min(state.to,GAP_END);$('gap').hidden=start>=end;$('gap').style.left=position(start)+'%';$('gap').style.width=Math.max(0,position(end)-position(start))+'%';
  $('versionMark').hidden=VERSION_TIME<=state.from||VERSION_TIME>=state.to;$('versionMark').style.left=position(VERSION_TIME)+'%';
  $('events').replaceChildren();for(const e of keyEvents.filter(e=>e.at>=state.from&&e.at<state.to)){const b=document.createElement('button');b.type='button';b.className='event-marker';b.dataset.kind=e.kind;b.style.left=position(e.at)+'%';b.textContent=e.glyph;b.title=time(e.at)+' '+e.label;b.setAttribute('aria-label',b.title);b.addEventListener('click',()=>{seek(e.at,false);notify(e.label+' · '+time(e.at));});$('events').append(b);}
  $('progress').max=String((state.to-state.from)/1000);$('duration').textContent=duration(state.to-state.from);$('rangeText').textContent='2026-11-02 '+time(state.from)+' — '+time(state.to);
}
function render(){
  $('currentTime').textContent=time(state.current);$('compactTime').textContent=time(state.current);$('badgeTime').textContent='2026-11-02 '+time(state.current);$('elapsed').textContent=duration(state.current-state.from);$('timeline').style.setProperty('--progress',position(state.current)+'%');
  if(!state.dragging&&state.mode!=='seeking'&&state.target===null)$('progress').value=String((state.current-state.from)/1000);
  $('progress').setAttribute('aria-valuetext','当前已呈现 '+time(state.current)+(state.target!==null?'，目标 '+time(state.target):''));
  const labels={paused:'已暂停',playing:'播放中',seeking:'正在定位',gap:'数据缺口',error:'加载失败',empty:'无历史数据',ended:'已结束',live:'实时示意',returning:'正在返回实时'};
  $('stateChip').textContent=labels[state.mode]||'已暂停';$('stateChip').className='state-chip'+(state.mode==='playing'?' is-playing':['gap','empty'].includes(state.mode)?' is-warning':state.mode==='error'?' is-error':'');
  $('playText').textContent=state.playing?'暂停':'播放';$('playIcon').setAttribute('href',state.playing?'#i-pause':'#i-play');$('play').setAttribute('aria-label',state.playing?'暂停':'播放');$('compactPlay').textContent=state.playing?'暂停':'播放';
  const blocked=['seeking','returning','empty'].includes(state.mode);$('play').disabled=blocked;$('compactPlay').disabled=blocked;$('progress').disabled=['empty','live','returning'].includes(state.mode);$('back10').disabled=blocked;$('forward10').disabled=blocked;
  $('version').textContent=state.current>=VERSION_TIME?'v4':'v3';$('previousEvent').disabled=blocked||!keyEvents.some(e=>e.at<state.current&&e.at>=state.from);$('nextEvent').disabled=blocked||!keyEvents.some(e=>e.at>state.current&&e.at<state.to);
  moveVehicle();
}
function seek(target,resume=state.playing){
  target=Math.max(state.from,Math.min(state.to,target));const generation=++state.generation;clearTimeout(seekTimer);state.playing=false;state.dragging=false;state.target=target;
  if(inGap(target)){state.mode='gap';state.target=null;$('seekPreview').textContent='';gapStatus('09:37–09:40 无完整历史，保留最后有效画面。');render();return;}
  state.mode='seeking';$('seekPreview').textContent='正在定位至 '+time(target)+' · 当前画面暂不改变';status('');$('progress').value=String((target-state.from)/1000);render();
  seekTimer=setTimeout(()=>{if(generation!==state.generation)return;state.current=target;state.target=null;state.mode=target>=state.to?'ended':resume?'playing':'paused';state.playing=resume&&target<state.to;$('seekPreview').textContent='';lastFrame=performance.now();render();},320);
}
function togglePlay(){if(['seeking','returning','empty','live'].includes(state.mode))return;if(state.mode==='gap'){notify('该段存在缺口，请先跳至下一可用时刻。');return;}status('');if(state.current>=state.to){seek(state.from,true);return;}state.playing=!state.playing;state.mode=state.playing?'playing':'paused';lastFrame=performance.now();render();}
$('play').onclick=togglePlay;$('compactPlay').onclick=togglePlay;$('back10').onclick=()=>seek(state.current-10000);$('forward10').onclick=()=>seek(state.current+10000);
$('previousEvent').onclick=()=>{const e=keyEvents.filter(e=>e.at<state.current&&e.at>=state.from).at(-1);if(e)seek(e.at,false);};$('nextEvent').onclick=()=>{const e=keyEvents.find(e=>e.at>state.current&&e.at<state.to);if(e)seek(e.at,false);};
$('progress').addEventListener('pointerdown',()=>{state.resume=state.playing;state.playing=false;state.dragging=true;if(state.mode!=='empty')state.mode='paused';clearTimeout(seekTimer);state.generation++;render();});
$('progress').addEventListener('input',()=>{if(!state.dragging){state.resume=state.playing;state.playing=false;}state.target=state.from+Number($('progress').value)*1000;$('seekPreview').textContent='目标 '+time(state.target)+' · 松开后定位，当前画面保持 '+time(state.current);render();});
$('progress').addEventListener('change',()=>{seek(state.from+Number($('progress').value)*1000,state.resume);$('hoverTime').hidden=true;});
$('progress').addEventListener('pointercancel',()=>{state.dragging=false;state.target=null;state.mode='paused';$('seekPreview').textContent='';render();});
$('progress').addEventListener('pointermove',event=>{const r=$('progress').getBoundingClientRect();const p=Math.max(0,Math.min(1,(event.clientX-r.left)/r.width));$('hoverTime').hidden=false;$('hoverTime').style.left=Math.max(7,Math.min(93,p*100))+'%';$('hoverTime').textContent=time(state.from+p*(state.to-state.from))+(inGap(state.from+p*(state.to-state.from))?' · 缺口':'');});
$('progress').addEventListener('pointerleave',()=>$('hoverTime').hidden=true);
for(const speed of [.25,.5,1,2,4,8]){const b=document.createElement('button');b.type='button';b.dataset.speed=String(speed);b.textContent=speed+'×';b.classList.toggle('selected',speed===1);b.setAttribute('aria-label','设置为'+speed+'倍速');b.onclick=()=>{state.speed=speed;$('speedValue').textContent=speed+'×';for(const item of $('speedMenu').children)item.classList.toggle('selected',Number(item.dataset.speed)===speed);$('speedMenu').hidden=true;$('speedButton').setAttribute('aria-expanded','false');$('speedButton').focus();};$('speedMenu').append(b);}
$('speedButton').onclick=()=>{$('speedMenu').hidden=!$('speedMenu').hidden;$('speedButton').setAttribute('aria-expanded',String(!$('speedMenu').hidden));};
document.addEventListener('click',event=>{if(!event.target.closest('.speed-wrap')){$('speedMenu').hidden=true;$('speedButton').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('speedMenu').hidden=true;$('speedButton').setAttribute('aria-expanded','false');}});
$('collapse').onclick=()=>{const collapsed=$('panel').classList.toggle('collapsed');$('collapse').textContent=collapsed?'展开⌃':'收起⌄';$('collapse').setAttribute('aria-expanded',String(!collapsed));};
function returnLive(){clearTimeout(seekTimer);state.generation++;state.playing=false;state.mode='returning';state.target=null;$('seekPreview').textContent='正在返回实时视图（仅原型演示）';render();seekTimer=setTimeout(()=>{state.mode='live';$('panel').hidden=true;$('liveMini').hidden=false;$('modeTitle').textContent='实时视图 · 示意';$('seekPreview').textContent='';status('');},350);}
$('returnLive').onclick=returnLive;$('compactLive').onclick=returnLive;$('reopen').onclick=()=>{state.mode='paused';$('panel').hidden=false;$('liveMini').hidden=true;$('modeTitle').textContent='历史回放';$('demoState').value='normal';render();};
$('rangeButton').onclick=()=>{$('rangeStart').value=dateInput(state.from);$('rangeEnd').value=dateInput(state.to);$('rangeError').textContent='';$('rangeDialog').showModal();};$('cancelRange').onclick=()=>$('rangeDialog').close();
$('rangeForm').onsubmit=event=>{event.preventDefault();const from=Date.parse($('rangeStart').value+'+08:00'),to=Date.parse($('rangeEnd').value+'+08:00');if(!Number.isFinite(from)||!Number.isFinite(to)||to<=from||from<BASE||to>BASE+3600e3){$('rangeError').textContent='请选择示意覆盖内的有效起止时间，结束须晚于开始。';return;}if(from>=GAP_START&&to<=GAP_END){$('rangeError').textContent='该范围全部处于数据缺口，请选择其他时段。';return;}clearTimeout(seekTimer);state.generation++;state.playing=false;state.from=from;state.to=to;state.current=Math.max(from,Math.min(to,state.current));if(inGap(state.current))state.current=from<GAP_START?from:GAP_END;state.mode='paused';state.target=null;drawTimeline();status('');$('demoState').value='normal';$('rangeDialog').close();render();};
$('demoState').onchange=()=>{const mode=$('demoState').value;clearTimeout(seekTimer);state.generation++;state.playing=false;state.target=null;$('panel').hidden=false;$('liveMini').hidden=true;$('modeTitle').textContent='历史回放';$('panel').classList.remove('collapsed');$('collapse').textContent='收起⌄';$('collapse').setAttribute('aria-expanded','true');if(mode==='loading'){state.mode='seeking';$('seekPreview').textContent='正在定位至 '+time(Math.min(state.to,state.current+60000))+' · 原画面与时刻保持';status('定位加载状态示意，不存在真实网络请求。','结束演示',resetDemo);}else if(mode==='error'){state.mode='error';$('seekPreview').textContent='';status('历史数据加载失败，保留最后有效画面。','重试',resetDemo,true);}else if(mode==='empty'){state.mode='empty';$('seekPreview').textContent='';status('该范围没有可回放数据，请调整时间范围。','选择范围',()=>$('rangeButton').click());}else resetDemo();render();};
function resetDemo(){clearTimeout(seekTimer);state.generation++;state.mode='paused';state.playing=false;state.target=null;$('seekPreview').textContent='';$('demoState').value='normal';status('');render();}
// 以下仅绘制与播放时间关联的示意场景，不接入真实设备或历史服务。
const NS='http://www.w3.org/2000/svg';function node(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,String(v));parent.append(n);return n;}
const project=(x,y,z)=>[820+(x-y)*32,235+(x+y)*13-z*29];
function polygon(points,fill,parent,stroke='#86aec525'){return node('polygon',{points:points.map(p=>project(...p).join(',')).join(' '),fill,stroke,'stroke-width':.7},parent);}
function box(x,y,z,w,d,h,colors,parent){polygon([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],colors[0],parent);polygon([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],colors[1],parent);polygon([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],colors[2],parent);}
const geometry=$('warehouse-geometry');polygon([[-2,-2,0],[21,-2,0],[21,15,0],[-2,15,0]],'#384d57',geometry);for(let i=-2;i<=21;i++){const a=project(i,-2,0),b=project(i,15,0);node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#72858b26'},geometry);}for(let i=-2;i<=15;i++){const a=project(-2,i,0),b=project(21,i,0);node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#72858b26'},geometry);}
for(const row of [0,4,10]){for(let col=0;col<4;col++){const x=col*4.1+1,y=row;for(let level=0;level<4;level++){box(x,y,.2+level*1.45,3.5,1.5,.12,['#31566b','#253f50','#577d92'],geometry);for(let bin=0;bin<3;bin++){const empty=(col+level+bin+row)%11===0;if(!empty)box(x+.22+bin*1.04,y+.14,.34+level*1.45,.82,1.13,.83,['#a9a292','#888776','#c4bb9f'],geometry);}}for(const dx of [0,3.4])for(const dy of [0,1.4])box(x+dx,y+dy,.05,.12,.12,5.9,['#436c80','#2e4e62','#7190a1'],geometry);}}
box(1.5,7.1,.3,15.5,.7,.45,['#52636c','#2e424e','#84949c'],geometry);for(let i=0;i<25;i++){const a=project(1.65+i*.6,7.13,.79),b=project(1.65+i*.6,7.76,.79);node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#abb7bc', 'stroke-width':2},geometry);}for(let i=0;i<3;i++)box(4+i*3.8,7.15,.8,.7,.55,.6,['#99a99e','#708574','#c2c8b1'],geometry);
const vehicle=$('demo-vehicle');box(0,0,.05,1.15,.8,.25,['#238d9b','#195b68','#51bdc9'],vehicle);box(.2,.15,.3,.7,.5,.5,['#b6a98c','#92866b','#d1c3a2'],vehicle);
function moveVehicle(){const origin=project(0,0,0),p=project(3+(state.current-BASE)/3600e3*12,8.8,0);vehicle.setAttribute('transform','translate('+(p[0]-origin[0])+','+(p[1]-origin[1])+')');}
function frame(now){const elapsed=Math.min(1000,now-lastFrame);lastFrame=now;if(state.playing){const next=state.current+elapsed*state.speed;if(state.current<GAP_START&&next>=GAP_START&&state.to>GAP_START){state.current=GAP_START-1000;state.playing=false;state.mode='gap';gapStatus('已到达 09:37–09:40 数据缺口，不自动跨越。');}else if(next>=state.to){state.current=state.to;state.playing=false;state.mode='ended';}else state.current=next;render();}}
drawTimeline();render();
// 原型使用独立计时器更新示意时刻，避免嵌入预览的绘制节流阻塞控件演示。
setInterval(()=>frame(performance.now()),100);
</script>
