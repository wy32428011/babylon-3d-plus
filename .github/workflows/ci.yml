name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 质量门禁只跑类型检查 / lint / 单元测试，不需要 Electron 二进制，跳过下载以加速安装。
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ELECTRON_BUILDER_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  static-checks:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: New pure module unused checks
        run: npm run typecheck:quality
      - name: Test entry compatibility
        run: npm run test:entries
      - name: Lint (仅 error 会失败，warning 用于渐进治理)
        run: npm run lint
      - name: Quality configuration formatting
        run: npm run format:check
      - name: Test inventory freshness
        run: node scripts/generate-test-inventory.mjs --check

  unit-tests:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:ci
