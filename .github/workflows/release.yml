name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release-windows:
    name: Build & Publish Windows NSIS Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$pkgVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not match package.json version '$expectedTag'."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win:github
